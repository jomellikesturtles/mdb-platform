# move this to another folder

# version: "3.8"
services:
  # Infrastructure

  traefik:
    image: traefik:v3.6
    command:
      - "--api.insecure=true"           # dashboard at http://localhost:8080/dashboard/
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"                     # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # Secure dashboard router (requires traefik.mdb.localhost in /etc/hosts)
      # - "traefik.http.routers.dashboard.rule=Host(`traefik.mdb.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      # - "traefik.http.routers.dashboard.service=api@internal"
      # - "traefik.http.routers.dashboard.entrypoints=web"
      # - "traefik.http.middlewares.auth.basicauth.users=admin:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/"
      # - "traefik.http.routers.dashboard.middlewares=auth"
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.docker.localhost`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"
    ports:
      - 5435:80
  # kafka:
  #   ports:
  #     - "8092:8080"
  # rabbitmq:
  #   ports:
  #     - "8484:8080"
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8484:8080"
    command: start-dev
  # MinIO:
  #   ports:
  #     - "9001:9000"
  redis:
    image: redis:alpine
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: 5s
    ports:
      - 6380:6379
    networks:
      - back-tier
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "mdb_prod"
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: 5s
    ports:
      - 5433:5432
    networks:
      - back-tier
  #

  # supabase/postgres 14.1.0 and beyond

  supabase-db:
    image: supabase/postgres:15.6.1.143
    ports:
      - "5434:5432"
    environment:
      POSTGRES_PASSWORD: postgres

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: global-service-kafka
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://global-service-kafka:29092,EXTERNAL://localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@global-service-kafka:29093"
      # Bind to 0.0.0.0 so Kafka accepts traffic from outside the container
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - back-tier
      - proxy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9095:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: global-service-kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - back-tier

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"    # AMQP
      - "15673:15672"  # Management UI → http://localhost:15673
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: mdb
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back-tier

  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: portainer
  #   restart: always
  #   ports:
  #     - "9443:9443"
  #     - "9000:9000"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - portainer_data:/data
  #   networks:
  #     - back-tier

  alert-manager:
    image: prom/alertmanager
    volumes:
      # - "./alertmanager.yml:/alertmanager/alertmanager.yml"
      - "./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml"
      - "alertmanager-data:/alertmanager"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring-tier
    ports:
      - 9094:9093

  loki:
    image: grafana/loki:latest
    ports:
      - 3100:3100
    volumes:
      - ./loki-stack/loki-config.yml:/etc/loki/loki-config.yaml
    networks:
      - monitoring-tier

  promtail:
    image: grafana/promtail:latest
    user: root
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring-tier

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3001:3000
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring-tier

    # image: grafana/grafana-enterprise
    # container_name: grafana
    # ports:
    #   - "3001:3000"
  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
      - "./prometheus/rules.yml:/etc/prometheus/rules.yml"
    networks:
      - monitoring-tier
    ports:
      - 9091:9090

  # Web apps

  web:
    build: ./mdb-electron
    ports:
      - "4001:80"
    volumes:
      - ./mdb-electron/dist/mdb-electron:/usr/share/nginx/html
  admin-web:
    build: ./mdb-admin-web-app
    ports:
      - 4002:80
    networks:
      - front-tier
      - back-tier
      - proxy
  #   depends_on:
  #     - bff
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.admin-web.rule=Host(`admin.localhost`)"
      - "traefik.http.routers.admin-web.entrypoints=web"
      - "traefik.http.services.admin-web.loadbalancer.server.port=80"
  overview:
    build: ./mdb-overview
    # entrypoint
    ports:
      - 4003:80
    networks:
      - front-tier
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.overview.rule=Host(`overview.mdb.localhost`)"
      - "traefik.http.routers.overview.entrypoints=web"
      - "traefik.http.services.overview.loadbalancer.server.port=80"
  # API and BFF Layer

  config-server:
    build: ./mdb-config-server
    container_name: mdb-config-server
    ports:
      - "8888:8888"
    environment:
      - CONFIG_REPO_URI=${CONFIG_REPO_URI:-https://github.com/your-org/mdb-config-repo}
      - KAFKA_BROKER=global-service-kafka:29092
    networks:
      - back-tier

  bff:
    image: 145099743252137218288881570337/mdb-api:latest
    ports:
      - 5001:8082
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.bff.rule=Host(`api.mdb.localhost`) && PathPrefix(`/mdb`)"
      - "traefik.http.services.bff.loadbalancer.server.port=8082"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # config-server:
      #   condition: service_started
    #   - media-data-gateway-service
    environment:
      SPRING_PROFILES_ACTIVE: dev,asia,local
      # SPRING_CONFIG_IMPORT: optional:configserver:http://mdb-admin:secret-config-pass@config-server:8888/
      SERVER_SERVLET_CONTEXT_PATH: /mdb
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/mdb_prod
      # externalized config files
      # SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RESILIENCE4J_RATELIMITER_INSTANCES_TMDB_LIMIT_FOR_PERIOD: 4
      RESILIENCE4J_RATELIMITER_INSTANCES_TMDB_LIMIT_REFRESH_PERIOD: 100ms
      RESILIENCE4J_RATELIMITER_INSTANCES_TMDB_TIMEOUT_DURATION: 2s
    command:
      [
        "java",
        "-jar",
        "/mdb-0.0.0-SNAPSHOT.jar",
        "--server.servlet.context-path=/mdb",
        # "--spring.config.import=optional:configserver:http://mdb-admin:secret-config-pass@config-server:8888/",
        "--management.endpoints.web.exposure.include=*",
        "--management.endpoint.health.show-details=always",
      ]
    volumes:
      - ./mdb-api/src/main/resources:/app/config:ro
    networks:
      - back-tier
      - proxy
  # admin-bff-service:

  # Domain Services

  media-data-gateway-service:
    # build: ./media-data-gateway-service
    image: 145099743252137218288881570337/media-data-gateway-service:latest 
    container_name: media-data-gateway-service
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/mdb_prod?currentSchema=public
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - 6002:9090   # gRPC
      - 6003:8080   # HTTP actuator (Prometheus scrape)
    networks:
      - back-tier
      - monitoring-tier
    logging:
      driver: json-file
      options:
        tag: "{{.Name}}"
    labels:
      - "logging=promtail"
      - "service=media-data-gateway-service"
  # user-data-gateway-service:
  #   build: ./user-data-gateway-service
  #   depends_on:
  #     postgres-db:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/mdb_prod?currentSchema=public
  #     SPRING_DATASOURCE_USERNAME: postgres
  #     SPRING_DATASOURCE_PASSWORD: postgres
  #   ports:
  #     - 6001:9090
  #   networks:
  #     - back-tier

  # Workers and Async Services

  # crawler-service:
  #   build: ./user-data-gateway-service
  #   depends_on:
  #     postgres-db:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/mdb_prod?currentSchema=public
  #     SPRING_DATASOURCE_USERNAME: postgres
  #     SPRING_DATASOURCE_PASSWORD: postgres
  #   ports:
  #     - 7001:9090
  #   networks:
  #     - back-tier
  notification-service:
    image: 145099743252137218288881570337/notification-service:latest
    # build: ./user-data-gateway-service
    # depends_on:
    #   postgres-db:
    #     condition: service_healthy
    env_file:
      - ./config/notification-service/.env
    ports:
      - 7002:3500
    networks:
      - back-tier
      - proxy

volumes:
  db-data:
  portainer_data:
  prometheus_data:
  alertmanager-data:
  grafana-storage: {}
  rabbitmq-data:
networks:
  
  front-tier:
  back-tier:
    name: mdb-platform_back-tier
    external: true
  proxy:
  monitoring-tier:
    driver: bridge
